name: C++ Build and Test

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build
        run: cmake --build ${{ github.workspace }}/build

      - name: Smoke test (library + demo via Connect/Receive/Disconnect)
        run: |
          cd ${{ github.workspace }}/build
          printf 'cmd1\ncmd2\ncmd3\ncmd4\ncmd5\n{\ncmd6\ncmd7\n}\ncmd8\n' \
            | LD_LIBRARY_PATH=. ./async_demo 3 > out.txt
          cat out.txt
          grep -q 'bulk: cmd1, cmd2, cmd3' out.txt
          grep -q 'bulk: cmd4, cmd5' out.txt
          grep -q 'bulk: cmd6, cmd7' out.txt
          grep -q 'bulk: cmd8' out.txt
          test "$(ls bulk*.log | wc -l)" -eq 4

      - name: Package (cpack)
        run: |
          cd ${{ github.workspace }}/build
          cpack

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        with:
          files: |
            build/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
